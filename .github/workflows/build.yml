name: build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  # Opt JavaScript actions into Node.js 24 ahead of GitHub forcing it on
  # 2026-06-02. Lets us drop the deprecation warnings without waiting
  # for upstream actions to ship Node 24-native versions.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [banking-web-ui, banking-database, banking-worker]
    steps:
      - uses: chainguard-actions/actions-checkout@4bd7a17abe2831437319177abe1a3c33c5678001  # v4

      - uses: chainguard-actions/docker-setup-buildx-action@86d1cdbf7339bbba34cc3f29421a2b8005adfb7a  # v3

      - name: Compose Chainguard library credentials
        env:
          CG_NPM_USER:  ${{ secrets.CG_NPM_USER }}
          CG_NPM_PASS:  ${{ secrets.CG_NPM_PASS }}
          CG_PYPI_USER: ${{ secrets.CG_PYPI_USER }}
          CG_PYPI_PASS: ${{ secrets.CG_PYPI_PASS }}
        run: |
          enc() { python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$1"; }
          {
            echo "CG_NPM_AUTH_B64=$(printf '%s' "$CG_NPM_USER:$CG_NPM_PASS" | base64 -w0)"
            echo "CG_PIP_INDEX_URL=https://$(enc "$CG_PYPI_USER"):$(enc "$CG_PYPI_PASS")@libraries.cgr.dev/python/simple/"
          } >> "$GITHUB_ENV"

      - name: Build ${{ matrix.service }}
        uses: chainguard-actions/docker--build-push-action@b048d672ea4a85435db65ae80a5db354f78d3c87  # v6
        with:
          context: ./${{ matrix.service }}
          push: false
          load: true
          tags: ${{ matrix.service }}:ci
          secret-envs: |
            cg_npm_auth_b64=CG_NPM_AUTH_B64
            cg_pip_index_url=CG_PIP_INDEX_URL
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

      - name: Scan ${{ matrix.service }} with grype
        uses: chainguard-actions/anchore-scan-action@2bbe514fdfc15d6afd73e553ad2f87715b597079  # v5
        with:
          image: ${{ matrix.service }}:ci
          fail-build: false
          severity-cutoff: critical
          output-format: table

      - name: Save image
        run: docker save ${{ matrix.service }}:ci -o /tmp/${{ matrix.service }}.tar

      - name: Upload image artifact
        uses: chainguard-actions/actions-upload-artifact@06f4847a8894deb68d34c095cad713faeac5b5f0  # v4
        with:
          name: image-${{ matrix.service }}
          path: /tmp/${{ matrix.service }}.tar
          retention-days: 1

  lint-chart:
    runs-on: ubuntu-latest
    steps:
      - uses: chainguard-actions/actions-checkout@4bd7a17abe2831437319177abe1a3c33c5678001  # v4

      - uses: chainguard-actions/azure-setup-helm@f063d4ef105cdea2eda2860a1eef0995175f8418  # v4

      - name: Lint chart
        run: helm lint ./chart

  deploy-kind:
    needs: [build-and-scan, lint-chart]
    runs-on: ubuntu-latest
    steps:
      - uses: chainguard-actions/actions-checkout@4bd7a17abe2831437319177abe1a3c33c5678001  # v4

      - name: Download image artifacts
        uses: chainguard-actions/actions-download-artifact@c922f60f5e235ac0f69aa8a9d40c972e973b129f  # v4
        with:
          path: /tmp/images
          pattern: image-*
          merge-multiple: true

      - uses: chainguard-actions/helm-kind-action@18bc0ff6f003dd0744cdcc605ebfb044ba906ee4  # v1
        with:
          cluster_name: kind

      - name: Load images into kind
        run: |
          for tar in /tmp/images/*.tar; do
            docker load -i "$tar"
          done
          kind load docker-image \
            banking-web-ui:ci \
            banking-database:ci \
            banking-worker:ci \
            --name kind

      - uses: chainguard-actions/azure-setup-helm@f063d4ef105cdea2eda2860a1eef0995175f8418  # v4

      - name: Helm install
        run: |
          helm install banking-demo ./chart \
            --namespace banking-demo --create-namespace \
            --set image.tag=ci \
            --set image.pullPolicy=Never \
            --wait --timeout 5m

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl get pods -n banking-demo -o wide
          kubectl describe pods -n banking-demo
          kubectl logs -n banking-demo --all-containers --tail=200 || true
