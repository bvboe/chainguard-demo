name: build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  # Opt JavaScript actions into Node.js 24 ahead of GitHub forcing it on
  # 2026-06-02. Lets us drop the deprecation warnings without waiting
  # for upstream actions to ship Node 24-native versions.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [banking-web-ui, banking-database, banking-worker]
    steps:
      - uses: chainguard-actions/actions-checkout@d1f1061cdaee56aa3a3bc3deb86b67b1db772dd6  # v6.0.2

      - uses: docker/setup-buildx-action@v3

      - name: Compose Chainguard library credentials
        env:
          CG_NPM_USER:  ${{ secrets.CG_NPM_USER }}
          CG_NPM_PASS:  ${{ secrets.CG_NPM_PASS }}
          CG_PYPI_USER: ${{ secrets.CG_PYPI_USER }}
          CG_PYPI_PASS: ${{ secrets.CG_PYPI_PASS }}
        run: |
          enc() { python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$1"; }
          {
            echo "CG_NPM_AUTH_B64=$(printf '%s' "$CG_NPM_USER:$CG_NPM_PASS" | base64 -w0)"
            echo "CG_PIP_INDEX_URL=https://$(enc "$CG_PYPI_USER"):$(enc "$CG_PYPI_PASS")@libraries.cgr.dev/python/simple/"
          } >> "$GITHUB_ENV"

      - name: Build ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: false
          load: true
          tags: ${{ matrix.service }}:ci
          secret-envs: |
            cg_npm_auth_b64=CG_NPM_AUTH_B64
            cg_pip_index_url=CG_PIP_INDEX_URL
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

      - name: Scan ${{ matrix.service }} with grype
        uses: chainguard-actions/anchore-scan-action@1e3adf7761b663ebd2c9048b7bd69a7df7bd3834  # v7.4.0
        with:
          image: ${{ matrix.service }}:ci
          fail-build: false
          severity-cutoff: critical
          output-format: table

      - name: Save image
        run: docker save ${{ matrix.service }}:ci -o /tmp/${{ matrix.service }}.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.service }}
          path: /tmp/${{ matrix.service }}.tar
          retention-days: 1

  lint-chart:
    runs-on: ubuntu-latest
    steps:
      - uses: chainguard-actions/actions-checkout@d1f1061cdaee56aa3a3bc3deb86b67b1db772dd6  # v6.0.2

      - uses: azure/setup-helm@v4

      - name: Lint chart
        run: helm lint ./chart

  deploy-kind:
    needs: [build-and-scan, lint-chart]
    runs-on: ubuntu-latest
    steps:
      - uses: chainguard-actions/actions-checkout@d1f1061cdaee56aa3a3bc3deb86b67b1db772dd6  # v6.0.2

      - name: Download image artifacts
        uses: chainguard-actions/actions-download-artifact@32ccc81b9ae713e3356ab659b862168905dec3e8  # v8.0.1
        with:
          path: /tmp/images
          pattern: image-*
          merge-multiple: true

      - uses: helm/kind-action@v1
        with:
          cluster_name: kind

      - name: Load images into kind
        run: |
          for tar in /tmp/images/*.tar; do
            docker load -i "$tar"
          done
          kind load docker-image \
            banking-web-ui:ci \
            banking-database:ci \
            banking-worker:ci \
            --name kind

      - uses: azure/setup-helm@v4

      - name: Helm install
        run: |
          helm install banking-demo ./chart \
            --namespace banking-demo --create-namespace \
            --set image.tag=ci \
            --set image.pullPolicy=Never \
            --wait --timeout 5m

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl get pods -n banking-demo -o wide
          kubectl describe pods -n banking-demo
          kubectl logs -n banking-demo --all-containers --tail=200 || true
